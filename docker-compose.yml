services:

  app-db:
    image: postgres:17-alpine
    container_name: app-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql/data
    restart: always

  pg-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: todoapp-pg-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:app-db:5432
    ports:
      - "127.0.0.1:5432:5432"